<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume decision report</title>
<style>

:root{
  --bg:#fcfcfb;--surface:#f4f4f2;--surface-2:#efeeeb;
  --ink:#1b1b1a;--ink-2:#585754;--ink-3:#8c8a85;
  --line:#eceae5;--line-2:#dcd9d2;--line-3:#cbc7bd;
  --accent:#35566b;--accent-soft:#eaf0f3;
  --u-crit:#b23b30;--u-high:#c08a2e;--u-med:#7f8a63;--u-low:#b7b2a6;--u-none:#d3cfc6;--done:#5f7a53;--bad:#b23b30;--accent2:#35566b;
  --card:#fff;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit}
h1,h2{font-family:var(--sans);font-weight:600;letter-spacing:-.01em;margin:0}
a{color:var(--accent);text-decoration:none}
.muted,.quote,.meta{color:var(--ink-3);font-size:12px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.tri:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}

/* top bar — segmented mode pills */
.top{position:sticky;top:0;z-index:6;display:flex;gap:6px;align-items:center;padding:9px 4vw;background:var(--surface);border-bottom:1px solid var(--line-2)}
.top>span[style]{margin-right:auto}
.top button{font-size:12px;font-weight:500;color:var(--ink-2);background:none;border:1px solid transparent;border-radius:7px;padding:6px 15px;cursor:pointer;transition:.12s}
.top button:hover{color:var(--ink);background:var(--surface-2)}
.top button.active{background:#fff;color:var(--ink);border-color:var(--line-2);box-shadow:0 1px 2px rgba(0,0,0,.07)}
#crossExport{font-size:11px;color:var(--ink-3)}
.bridge{min-width:150px;text-align:right;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em}

.wrap{max-width:1180px;margin:26px auto;padding:0 4vw 90px}

/* decision card */
.decision{background:var(--ink);color:#fff;border-radius:12px;padding:22px 24px;box-shadow:0 2px 14px rgba(27,27,26,.16)}
.decision h1{font-size:22px;font-weight:600;margin:0 0 13px;letter-spacing:-.015em;line-height:1.28}
.gates{display:flex;flex-wrap:wrap;gap:8px}
.gates span{font-size:11px;font-weight:600;letter-spacing:.03em;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.17);color:#e9eef1;border-radius:999px;padding:4px 12px}

/* section cards */
.target,.readers,.attention,.outcomes{margin:20px 0;padding:18px 20px;background:var(--card);border:1px solid var(--line-2);border-radius:11px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.target h2,.readers h2,.attention h2,.outcomes h2,.observations h2{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
.readers p.muted{margin:-4px 0 12px}
.targetgrid,.readergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.targetgrid>div,.reader{padding:12px 13px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.reader b{display:block;font-size:12px;color:var(--ink);margin-bottom:3px}
.reader div{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:4px}
.reader small{color:var(--ink-2);line-height:1.5}
.targetgrid b{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.targetgrid p{margin:5px 0 4px;color:var(--ink);line-height:1.5}
.targetgrid small{color:var(--ink-3);font-size:11px}
.attention blockquote{margin:11px 0;padding-left:14px;border-left:2px solid var(--done);font-size:14px;line-height:1.5;color:var(--ink)}
.attention blockquote .muted{margin-top:4px}

/* findings header + buttons */
.observations{display:flex;align-items:center;gap:14px;margin:28px 0 10px}
.observations h2{margin:0 auto 0 0}
#observationToggle,.actions button,.acts button,.detailbox button{font-size:12px;font-weight:500;cursor:pointer;background:#fff;border:1px solid var(--line-2);color:var(--ink-2);border-radius:7px;padding:6px 12px;transition:.12s}
#observationToggle:hover,.actions button:hover,.acts button:hover,.detailbox button:hover{border-color:var(--accent);color:var(--accent)}

/* coverage table */
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line-2);border-radius:10px;font-size:13px}
thead th:first-child{border-top-left-radius:10px}
thead th:last-child{border-top-right-radius:10px}
tbody tr:last-child td:first-child{border-bottom-left-radius:10px}
tbody tr:last-child td:last-child{border-bottom-right-radius:10px}
thead th{position:sticky;top:44px;z-index:2;background:var(--surface);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:9px 11px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line);white-space:nowrap}
thead th:last-child{border-right:none}
tr.section.wholeread td{background:var(--surface-2);text-transform:none;border-top:2px solid var(--line-2);padding:9px 11px}
.wr-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wr-head b{font-size:14px}
.wr-verdict,.wr-status{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px}
.wr-assessment{margin-top:6px;color:var(--ink-2);font-size:12.5px;max-width:72ch}
.stale-badge{font-size:11px;font-weight:600;color:#8a5a00;background:#fbe7c9;border:1px solid #e6c67a;border-radius:6px;padding:2px 8px}
.sevfilter{display:flex;gap:8px;flex-wrap:wrap}
.sevchip{font-size:11px;font-weight:600;letter-spacing:.03em;cursor:pointer;border-radius:14px;padding:4px 11px;border:1px solid var(--line-2);background:#fff;color:var(--ink-3);opacity:.45}
.sevchip.on{opacity:1}
.sevchip.t1.on{color:#8a1c1c;border-color:#e0a3a3;background:#fbeaea}
.sevchip.t2.on{color:#8a5a00;border-color:#e6c67a;background:#fbe7c9}
.sevchip.t3.on{color:var(--ink-2);border-color:var(--line-2);background:var(--surface-2)}
.sevtag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-right:7px;vertical-align:1px}
.sevtag.t1{color:#8a1c1c;background:#fbeaea;border:1px solid #e0a3a3}
.sevtag.t2{color:#8a5a00;background:#fbe7c9;border:1px solid #e6c67a}
.sevtag.t3{color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line-2)}
.wr-verdict.v-strong{color:#1f6b3b;border-color:#a8d5ba}
.wr-verdict.v-adequate{color:#8a5a00;border-color:#e6c67a}
.wr-verdict.v-weak{color:#8a1c1c;border-color:#e0a3a3}
tr.section.wholeread.is-stale td{box-shadow:inset 3px 0 0 #e0a53a}
td{text-align:left;vertical-align:top;padding:9px 11px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
td:last-child{border-right:none}
tr.item:hover td{background:#f8fafb}
tr.section td{background:var(--surface-2);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border-top:1px solid var(--line-2)}
tbody tr:last-child td{border-bottom:none}
.c-n{text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-3);width:38px}
.c-status{text-align:center;width:42px}
.c-el b{font-size:13px;color:var(--ink)}
.c-el .quote{font-family:var(--mono);font-size:12px;line-height:1.4;color:var(--ink-2);margin-top:3px}
.c-verdict{white-space:nowrap;width:132px}
.c-act{white-space:nowrap;width:110px}
.c-act .actions button{padding:5px 9px}
tr.item[data-status="done"] .c-el b{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-3)}
tr.item[data-status="ignore"]{opacity:.55}

/* tri-state checkbox glyph */
.tri{display:inline-block;width:16px;height:16px;border:1.5px solid var(--line-3);border-radius:4px;background:#fff;cursor:pointer;padding:0;position:relative;vertical-align:middle;transition:.12s}
.tri:hover{border-color:var(--accent)}
.tri[data-st="done"]{background:var(--done);border-color:var(--done)}
.tri[data-st="done"]::after{content:"";position:absolute;left:5px;top:1px;width:3.5px;height:8.5px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
.tri[data-st="ignore"]{background:var(--surface-2);border-color:var(--line-2)}
.tri[data-st="ignore"]::after{content:"";position:absolute;left:3px;top:6.5px;width:8px;height:1.5px;background:var(--ink-3);border-radius:1px}

/* verdict dot */
.urgency{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;background:var(--u-none)}
.urgency.crit{background:var(--u-crit)}.urgency.high{background:var(--u-high)}.urgency.med{background:var(--u-med)}.urgency.low{background:var(--u-low)}.urgency.none{background:var(--u-none)}

.actions,.acts{display:flex;gap:5px;flex-wrap:wrap}
.c-act .actions{justify-content:flex-end}

/* expand panel */
.detail{display:none}
.detail.open{display:table-row}
.detailbox{padding:16px 14px 20px;background:var(--accent-soft);border-bottom:1px solid var(--line-2)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.field{padding:11px 13px;background:#fff;border:1px solid var(--line-2);border-radius:8px}
.field b{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:5px}
.field p{margin:0;font-size:14px;line-height:1.5}
.field button{margin-top:9px}
.detailbox pre{font-family:var(--mono);margin:12px 0 0;padding:13px 14px;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6;color:var(--ink-2);background:#fff;border:1px solid var(--line-2);border-radius:8px}
.error{color:var(--bad);min-height:1.4em;font-size:12px;margin-top:8px}
.saving{color:var(--accent)}

/* editor form */
.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.editor label{display:grid;gap:5px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.editor .wide{grid-column:1/-1}
.editor input,.editor textarea{font-family:var(--mono);font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--line-2);border-radius:7px;padding:8px 10px}
.editor textarea{min-height:80px}
.editor button{font-size:12px;font-weight:500;cursor:pointer;background:#fff;border:1px solid var(--line-2);color:var(--ink-2);border-radius:7px;padding:7px 14px}
.editor button[type="submit"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* résumé preview tab — a document sheet */
#resume,#linkedin{display:none;max-width:820px;margin:26px auto;background:#fff;border:1px solid var(--line-2);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:44px 54px}
#resume h1,#linkedin h1{font-size:26px;font-weight:700;text-align:center;letter-spacing:-.01em;margin:0 0 4px}
#resume h2,#linkedin h2{font-size:13px;font-weight:600;color:var(--ink-2);text-align:center;margin:0 0 12px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
#resume>p,#linkedin>p{color:var(--ink);margin:0 0 8px;line-height:1.55}
#linkedin p.muted{color:var(--ink-2);text-align:center;font-size:12px;margin:0 0 18px}
.preview-exp{margin:16px 0}
.preview-exp>b{font-size:14px;color:var(--ink)}
.preview-exp>div{font-size:12px;font-style:italic;color:var(--ink-2);margin:2px 0 6px}
.preview-exp ul{margin:6px 0 0;padding-left:18px}
.preview-exp li{margin:4px 0;line-height:1.5}

/* rubric tab */
#rubric{display:none}
#rubric .wrap{max-width:1180px;margin:26px auto;padding:0 4vw}
#rubric h1{font-size:19px;font-weight:600;margin:0 0 4px}
#rubric table{margin-top:14px}
#rubric td b{color:var(--ink)}
#rubric .quote{font-family:var(--mono);font-size:12px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 9px;margin:3px 0}
#rubric ul{margin:0;padding-left:16px}
#rubric li{margin:3px 0}
table.rubric{table-layout:fixed}
table.rubric th:nth-child(1),table.rubric td:nth-child(1){width:19%}
table.rubric th:nth-child(2),table.rubric td:nth-child(2){width:7%}
table.rubric th:nth-child(3),table.rubric td:nth-child(3){width:9%}
table.rubric th:nth-child(4),table.rubric td:nth-child(4){width:29%}
table.rubric th:nth-child(5),table.rubric td:nth-child(5){width:26%}
table.rubric td{vertical-align:top}
table.rubric .c-num{white-space:nowrap;font-variant-numeric:tabular-nums}
table.rubric .c-act{width:10%}
table.rubric .c-act .actions{display:flex;flex-direction:column;gap:4px}
tr.rdetail td{background:var(--surface-2);border-top:0}
.rdetail-in{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rdetail-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
@media (max-width:760px){.rdetail-in{grid-template-columns:1fr}}

/* craft tab */
#craft{display:none}
#craft .wrap{max-width:1180px;margin:26px auto;padding:0 4vw}
#craft h1{font-size:19px;font-weight:600;margin:0 0 4px}
#craft table{margin-top:14px}
#craft td b{color:var(--ink)}
#craft .quote{font-family:var(--mono);font-size:12px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 9px;margin:3px 0}
#craft ul{margin:0;padding-left:16px}
#craft li{margin:3px 0}
#craft .c-path{font-family:var(--mono);font-size:12px;word-break:break-all}
.cgrade{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.cgrade.g-winning{color:#1f6b3b;border-color:#a8d5ba}
.cgrade.g-competent{color:var(--ink-2);border-color:var(--line-2)}
.cgrade.g-median{color:#8a5a00;border-color:#e6c67a}
.cgrade.g-below-bar{color:#8a1c1c;border-color:#e0a3a3}

.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;font-size:12px;padding:10px 15px;border-radius:8px;display:none;box-shadow:0 3px 14px rgba(0,0,0,.22);z-index:40}
dialog{max-width:680px;width:calc(100% - 30px);border:1px solid var(--line-2);border-radius:11px;padding:20px}
dialog textarea{width:100%;min-height:280px;font-family:var(--mono);font-size:12px;border:1px solid var(--line-2);border-radius:7px;padding:10px}
.hidden{display:none!important}
@media(max-width:760px){.editor{grid-template-columns:1fr}.wrap{padding-left:5vw;padding-right:5vw}thead th{top:var(--navh,52px)}
html{scroll-padding-top:calc(var(--navh,52px) + 8px)}
tbody tr{scroll-margin-top:calc(var(--navh,52px) + var(--theadh,34px))}#resume{padding:30px 22px}th:nth-child(4),td:nth-child(4){display:none}}

</style>
</head>
<body>
<div class="top" aria-label="Report controls"><span style="margin-right:auto"></span><button id="reportMode">Report</button><button id="resumeMode">Résumé preview</button><button id="linkedinMode" class="hidden">LinkedIn</button><button id="rubricMode">Rubric</button><button id="craftMode" class="hidden">Craft</button><button id="crossExport" title="Copy the full report JSON; use only for explicit cross-item work">Cross-item export</button><span class="bridge" id="bridgeState">bridge offline</span></div>
<main id="report"><div class="wrap" id="app"></div></main>
<section id="resume"></section>
<section id="linkedin"></section>
<section id="rubric"></section>
<section id="craft"></section>
<div class="toast" id="toast" role="status"></div>

<script>
